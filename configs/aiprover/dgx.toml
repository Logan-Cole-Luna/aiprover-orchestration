# AIProver harness configuration for the persistent server cic-dgx-01
# (`aip-leanstral`), reached through its reasoning proxy (127.0.0.1:18566,
# service aiprover_reasoning_proxy_dgx), which records the model's reasoning
# per session. The ssh_* and port keys are unused in direct mode.

[endpoint]
mode = "direct"
ssh_host = "vista.tacc.utexas.edu"
ssh_user = "loganluna"
ssh_port = 22
control_socket = "~/.ssh/vista.sock"
ssh_options = []
server_handoff = "/scratch/11757/loganluna/servers/aiprover_server.txt"
# Fallback address when the handoff file is unreadable (empty = none).
remote_host = ""
remote_port = 8060
local_port = 18555
# The proxy; ssh_* and port keys above are unused in direct mode.
api_base = "http://127.0.0.1:18566/v1"
api_key = "EMPTY"
# Served model id; empty = the first id /v1/models reports.
model = ""

[runtime]
work_root = "~/workspace/aiprover_orchestration/aiprover/work"
# Concurrent rollouts on this machine, across all runs; each holds a Lean
# server (~2.5 GB measured at 13 sessions) and peaks near 5 GB while compiling
# (VM: 32 cores, 125 GB).
max_parallel = 48
# Experimental: semantic index of the pinned Mathlib (service
# aiprover_mathlib_index), served to the harness's lean_leanfinder tool;
# empty = the hosted index of v4.28.
leanfinder_url = "http://127.0.0.1:18570"
# 100 turns in 10800 s: the DGX serves turns several times slower than the
# Vista servers (5400 s); the harness derives its time fences from timeout_sec.
timeout_sec = 10800
max_turns = 100

[paths]
# Lean v4.23.0 + Mathlib v4.23.0 (37df177) + REPL + cslib.
lean_project = "~/workspace/lean_projects/TmpProjDir"
elan_home = "~/.elan"
vibe_venv = "~/workspace/aiprover_orchestration/aiprover/venv_vibe"
mcp_venv = "~/workspace/aiprover_orchestration/aiprover/venv_mcp"
rg_dir = "~/workspace/aiprover_orchestration/aiprover/bin"

[helpers]
# expand / backtranslate / ask: "auto" selects the helper model from the
# calling environment (see AIProver_plugin/README.md).
backend = "auto"
claude_model = ""
codex_sandbox = "read-only"
timeout_sec = 900
