# =============================================================================
# AIProver configuration of the aiprover-captain skill.
# The ONE file to edit on a new machine. After any edit:  ./setup.sh doctor
# Same format as AIProver/AIProver_plugin/aiprover.toml; read by the AIProver
# CLI through $AIPROVER_CONFIG, which the skill's env.sh sets to this file
# (linked at ~/.config/aiprover_orchestration/aiprover.toml by setup.sh).
# =============================================================================

[endpoint]
# ---- WHERE THE MODEL IS ------------------------------------------------------
# The machine you SSH into (IP or hostname) and the model's address as seen FROM it.
#
# CURRENT SERVER: the orchestration's Vista server job (aiprover_srv,
# scripts/vista/serve_aiprover_vista.sbatch), two GH200 nodes.
#   SSH into  vista.tacc.utexas.edu       <- the login node
#   model at  the compute node named in server_handoff below; reachable only
#             from inside TACC, which is why the SSH hop is needed.
#
# On the orchestration VM, mode = "direct" with api_base = "http://127.0.0.1:18565/v1"
# uses the reasoning proxy instead, which records the model's reasoning per session.
mode = "ssh"
ssh_host = "vista.tacc.utexas.edu"
ssh_user = "loganluna"            # your own TACC user
ssh_port = 22
remote_host = ""                  # fixed fallback when server_handoff is unreadable ("" = none)
remote_port = 8060

# Auto-follow: a file ON ssh_host that the vLLM job writes when it is up
# (`node=<n> port=<p> job=<id>`). When readable it WINS over remote_host/remote_port, so a server
# restarted on another node is followed with no edit. Must be readable by ssh_user.
server_handoff = "/scratch/11757/loganluna/servers/aiprover_server.txt"

# TACC needs MFA, which no script can answer: open ONE ssh master by hand (see README) and name
# its socket here; every tunnel rides it without prompting. Empty = plain key-based ssh.
control_socket = "~/.ssh/vista.sock"
# Extra ssh arguments, e.g. ["-i", "~/.ssh/id_ed25519"].
ssh_options = []

# The local end of the tunnel. Any free port on THIS machine.
local_port = 18555

# mode = "direct" only: the server is already reachable at api_base (no SSH).
api_base = "http://127.0.0.1:18555/v1"
api_key = "EMPTY"
# Served model name; empty = the first id /v1/models reports.
model = ""


[runtime]
# Jobs, per-sample workspaces and the coding agent's Lean scratch project. Must be writable.
# The trace pages read sample records from <work_root>/jobs.
work_root = "~/workspace/aiprover_orchestration/aiprover/work"
# Concurrent AIProver rollouts on THIS machine (global, across agents). Each holds a Lean
# server (~2.5 GB) and compiles peak ~5 GB.
max_parallel = 8
# Per-rollout wall clock (s) and the harness's turn budget, as in the served orchestration
# runs (configs/orchestrator/aiprover_vista_served.json). The harness derives its time fences
# from timeout_sec; `submit --timeout/--max-turns` override both per job.
timeout_sec = 5400
max_turns = 200


[paths]
# AIProver/AIProver_plugin/setup.sh (run by ./setup.sh deps) BUILDS whatever is missing at
# these paths; existing ones are used as they are.
# Lean v4.23.0 + Mathlib v4.23.0 + REPL + cslib; the same Mathlib as orchestration_workspace/.
lean_project = "~/workspace/lean_projects/TmpProjDir"
elan_home = "~/.elan"
# Python 3.12 venv with mistral-vibe==2.24.2 (the harness's agent loop).
vibe_venv = "~/workspace/aiprover_orchestration/aiprover/venv_vibe"
# Python 3.12 venv with lean-lsp-mcp==0.30.0 (+ leanclient patched for Lean 4.23).
mcp_venv = "~/workspace/aiprover_orchestration/aiprover/venv_mcp"
# Directory holding `rg` (ripgrep).
rg_dir = "~/workspace/aiprover_orchestration/aiprover/bin"

# No [helpers]: the skill makes no programmatic model calls, so `aiprover expand`,
# `backtranslate` and `ask` are not used.
